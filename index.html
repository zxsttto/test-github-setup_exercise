<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>
    
    <!-- Paragraph text -->
    <p>This is a basic paragraph of text. HTML is easy to learn and use.</p>
    
    <!-- Subheading -->
    <h2>Key Features</h2>
    
    <!-- Unordered List -->
    <ul>
        <li>Simple structure</li>
        <li>Easy to read</li>
        <li>Supported by all browsers</li>
    </ul>

    <!-- Hyperlink -->
    <p>Visit the official <a href="https://w3.org" target="_blank">W3C HTML website</a> to learn more.</p>

    <!-- Image Placeholder -->
    <img src="https://placeholder.com" alt="Placeholder Image">

</body>
</html>
